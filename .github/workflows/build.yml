# Builds and tests the app on every push and pull request.
# Push a tag like v1.2.0 to publish a signed APK as a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          # Android needs a number that goes up with every build.
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew :core:test

      # Pull requests do not get the signing secrets, so they only build a debug APK.
      - name: Build debug APK
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export UPLIFT_KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$UPLIFT_KEYSTORE"
          ./gradlew assembleRelease
          rm -f "$UPLIFT_KEYSTORE"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/uplift-15-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: uplift-15-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Uplift 15 $VERSION_NAME" --generate-notes
